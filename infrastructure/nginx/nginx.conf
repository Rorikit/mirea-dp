pid /tmp/nginx.pid;
events {}
http {
  server {
    listen 8080;
    server_tokens off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
    }
    location / { proxy_pass http://frontend:8080; proxy_set_header Host $host; }
  }
}
