pid /tmp/nginx.pid;
events {}
http {
  server {
    listen 8080;
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 8443 ssl;
    ssl_certificate /etc/letsencrypt/live/168.222.202.190/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/168.222.202.190/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
    location /api/ {
      proxy_pass http://backend:8000;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
    }
    location / { proxy_pass http://frontend:8080; proxy_set_header Host $host; }
  }
}
