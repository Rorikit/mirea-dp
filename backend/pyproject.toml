[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freshman-day-backend"
version = "0.1.0"
description = "Минимальный каркас API Дня первокурсника 2026"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.10,<3",
  "openpyxl>=3.1,<4",
  "qrcode[pil]>=8.0,<9",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-openpyxl>=3.1,<4"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
