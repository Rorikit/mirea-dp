services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freshman}
      POSTGRES_USER: ${POSTGRES_USER:-freshman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"], interval: 5s, timeout: 3s, retries: 10 }
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-freshman}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-freshman}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-development-only-change-me}
      APP_QR_PEPPER: ${APP_QR_PEPPER:-development-only-change-me}
      APP_LOGIN_RATE_LIMIT: ${APP_LOGIN_RATE_LIMIT:-0}
      APP_UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"], interval: 10s, timeout: 3s, retries: 5 }
  frontend:
    build: ./frontend
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"], interval: 10s, timeout: 3s, retries: 5 }
  nginx:
    build: ./infrastructure/nginx
    ports: ["8080:8080"]
    volumes: ["./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_healthy }
volumes:
  postgres_data:
  uploads:
