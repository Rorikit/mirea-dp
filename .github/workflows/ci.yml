name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: freshman_test
          POSTGRES_USER: freshman
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U freshman" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+asyncpg://freshman:test-password@127.0.0.1:5432/freshman_test
      APP_SECRET_KEY: ci-only-secret-not-for-production
      APP_QR_PEPPER: ci-only-qr-pepper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: ruff format --check app tests alembic && ruff check app tests alembic
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: alembic upgrade head && alembic check
        working-directory: backend
      - run: pytest -q --cov=app --cov-report=term-missing
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run test && npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend
