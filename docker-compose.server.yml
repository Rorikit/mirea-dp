name: mirea-dp

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freshman}
      POSTGRES_USER: ${POSTGRES_USER:-freshman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: mirea-dp-backend:latest
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-freshman}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-freshman}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      APP_QR_PEPPER: ${APP_QR_PEPPER:?APP_QR_PEPPER is required}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://168.222.202.160:8080}
      APP_LOGIN_RATE_LIMIT: ${APP_LOGIN_RATE_LIMIT:-5}
      APP_SECURE_COOKIES: "false"
      APP_UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: mirea-dp-frontend:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: mirea-dp-nginx:latest
    restart: unless-stopped
    ports:
      - "168.222.202.160:8080:8080"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
